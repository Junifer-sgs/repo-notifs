name: New repo notifier
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for new repos
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          USER_NAME: ${{ github.repository_owner }}
        run: |
          SINCE=$(date -u -d '16 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          curl -s "https://api.github.com/users/$USER_NAME/repos?sort=created&direction=desc&per_page=10" \
          | jq -c --arg since "$SINCE" '.[] | select(.created_at > $since)' \
          | while read -r repo; do
              NAME=$(echo "$repo" | jq -r .full_name)
              URL=$(echo "$repo" | jq -r .html_url)
              DESC=$(echo "$repo" | jq -r '.description // "No description"')
              curl -s -H "Content-Type: application/json" \
                -d "{\"embeds\":[{\"title\":\"New repository: $NAME\",\"url\":\"$URL\",\"description\":\"$DESC\",\"color\":3066993}]}" \
                "$WEBHOOK"
            done
